services:
  xbus-office:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xbus-office
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    volumes:
      - xbus_data:/app/src/data/json
      - xbus_avatars:/app/public/images/avatars
      - xbus_tea_images:/app/public/images/afternoon-tea
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    container_name: xbus-mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: xbus
      MYSQL_USER: xbus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  xbus_data:
  xbus_avatars:
  xbus_tea_images:
  mysql_data:
