services:
  xbus-office:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xbus-office
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    volumes:
      - xbus_data:/app/src/data/json
      - xbus_avatars:/app/public/images/avatars
      - xbus_tea_images:/app/public/images/afternoon-tea
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  xbus_data:
  xbus_avatars:
  xbus_tea_images:
