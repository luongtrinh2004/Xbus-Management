services:
  xbus-office:
    image: ${XBUS_IMAGE:-luongtrinh462004/xbus-office:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xbus-office
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - REDIS_URL=redis://redis:6379
    volumes:
      - xbus_data:/app/src/data/json
      - xbus_avatars:/app/public/images/avatars
      - xbus_tea_images:/app/public/images/afternoon-tea
      - xbus_gallery:/app/public/uploads/gallery
    restart: unless-stopped
    depends_on:
      - minio
      - redis

  gallery-worker:
    image: ${XBUS_IMAGE:-luongtrinh462004/xbus-office:latest}
    container_name: xbus-gallery-worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
    command: node scripts/gallery-upload-worker.mjs
    depends_on:
      - redis
      - minio
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xbus-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: xbus-minio
    # Port 9000: S3 API, Port 9001: MinIO Web Console (giao diện quản trị S3)
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-xbus_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-xbus_secret_password}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-https://xbus-office.xmobility.vn/minio/}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: xbus-mysql
    # Chỉ mở trên loopback của VPS để MySQL Workbench truy cập qua SSH tunnel.
    # Không mở 3306 ra Internet/LAN.
    ports:
      - "127.0.0.1:3307:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: xbus
      MYSQL_USER: xbus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  xbus_data:
  xbus_avatars:
  xbus_tea_images:
  xbus_gallery:
  minio_data:
  redis_data:
  mysql_data:
