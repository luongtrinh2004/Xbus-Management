# Included inside the existing XBus HTTP/HTTPS server blocks.
# Only Plane-owned routes go to Plane. XBus keeps /work/projects, /api/work,
# /api/auth, /api/users, /api/assets, /assets and /uploads/gallery.
location ~ ^/(?:xbus/(?:logo-icon\.svg|logo\.png|loading\.svg)$|xbus-office(?:/|$)|auth(?:/|$)|assets/|static/|live(?:/|$)|spaces(?:/|$)|god-mode(?:/|$)|settings/profile(?:/|$)|(?:site\.webmanifest|manifest)\.json$|uploads(?:$|/(?!gallery(?:/|$)))|api/(?:workspaces|workspace-slug-check|instances|timezones|unsplash|public|v1)(?:/|$)|api/users/(?:me|session|file-assets)(?:/|$)|api/assets/v2(?:/|$)) {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_buffering off;
}
